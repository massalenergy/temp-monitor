<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="ESP32 온습도 로그를 Google Sheets에서 읽어 표시하는 모니터">
<title>온습도 모니터</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--card:#111827;--card2:#172033;--border:#263348;--orange:#f97316;--cyan:#06b6d4;--blue:#3b82f6;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--text:#f1f5f9;--dim:#94a3b8;--muted:#64748b}
html{background:var(--bg)}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:700px;margin:0 auto;padding:20px 16px 30px}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.hdr h1{font-size:1.45rem;font-weight:700;line-height:1.3}
.hdr p{font-size:.76rem;color:var(--dim);margin-top:4px}
.hdr-actions{display:flex;gap:7px;flex-shrink:0}
.icon-btn,.action-btn{background:var(--card);border:1px solid var(--border);color:var(--dim);border-radius:9px;padding:7px 10px;font-size:.72rem;transition:.2s}
.icon-btn:hover,.action-btn:hover{border-color:var(--orange);color:var(--text)}
.icon-btn:disabled{opacity:.5;cursor:wait}
.status{display:flex;align-items:center;justify-content:center;gap:7px;min-height:23px;font-size:.75rem;margin-bottom:18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.dot.live{animation:pulse 2s infinite}
.dot.stale{background:var(--yellow)}
.dot.error{background:var(--red)}
.dot.cached{background:var(--yellow)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 14px;text-align:center;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.card.t::before{background:linear-gradient(90deg,var(--orange),var(--red))}
.card.h::before{background:linear-gradient(90deg,var(--cyan),var(--blue))}
.lbl{font-size:.7rem;color:var(--dim);margin-bottom:7px;font-weight:600}
.val{font-size:2.6rem;font-weight:900;line-height:1;white-space:nowrap}
.card.t .val{color:var(--orange)}
.card.h .val{color:var(--cyan)}
.val small{font-size:.35em;opacity:.65;font-weight:600}
.time{text-align:center;font-size:.78rem;color:var(--dim);margin-bottom:16px;min-height:20px}
.time b{color:var(--text)}
.age{font-size:.7rem;color:var(--muted);margin-left:3px}
.toolbar{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.toolbar .action-btn{padding:6px 11px}
.sec{margin-bottom:22px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sec h2{font-size:.88rem;font-weight:600;color:var(--dim)}
.range-bar{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.rbtn{background:var(--card);border:1px solid var(--border);color:var(--dim);padding:6px 13px;border-radius:20px;font-size:.7rem;font-weight:600;transition:.2s}
.rbtn:hover{border-color:var(--orange);color:var(--text)}
.rbtn.active{background:var(--orange);border-color:var(--orange);color:#fff}
.chart-box{position:relative;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;height:206px;touch-action:pan-y}
.chart-box canvas{width:100%!important;height:180px!important;display:block;touch-action:pan-y}
.chart-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.76rem;pointer-events:none}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.scroll{max-height:360px;overflow:auto}
.scroll::-webkit-scrollbar{width:4px;height:4px}
.scroll::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:.72rem}
thead th{padding:10px 6px;text-align:center;font-weight:600;color:var(--dim);background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
tbody td{padding:8px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
tbody tr:last-child td{border:none}
tbody tr:hover{background:rgba(255,255,255,.025)}
.tc{color:var(--orange);font-weight:600}.hc{color:var(--cyan);font-weight:600}
.empty{padding:30px!important;color:var(--dim)}
.settings{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:22px;padding:11px 13px;color:var(--dim);font-size:.73rem}
.settings summary{cursor:pointer;font-weight:600;color:var(--dim);outline:none}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.settings label{display:flex;flex-direction:column;gap:5px}
.settings input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:7px 8px;font-size:.78rem}
.settings input:focus{outline:1px solid var(--orange);border-color:var(--orange)}
.settings-help{font-size:.66rem;color:var(--muted);line-height:1.5;margin-top:10px}
.settings-actions{display:flex;gap:7px;margin-top:11px}
.settings-actions button{padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:var(--card2);color:var(--dim);font-size:.7rem}
.settings-actions button.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.ft{text-align:center;font-size:.65rem;color:#475569;margin-top:18px;line-height:1.7}
@media(max-width:430px){.hdr h1{font-size:1.3rem}.hdr-actions{gap:4px}.icon-btn,.action-btn{padding:6px 8px}.val{font-size:2.25rem}.settings-grid{grid-template-columns:1fr}}
@media(max-width:340px){.app{padding-left:10px;padding-right:10px}.val{font-size:1.9rem}.rbtn{padding:6px 10px}}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div><h1>온습도 모니터</h1><p>ESP32 로그 · Google Sheets 실시간 연동</p></div>
    <div class="hdr-actions"><button class="icon-btn" id="refreshBtn" type="button" title="지금 새로고침">↻ 새로고침</button></div>
  </header>
  <div class="status" aria-live="polite"><div class="dot live" id="dot"></div><span id="st">연결 중...</span></div>

  <div class="grid2">
    <div class="card t"><div class="lbl">최신 온도</div><div class="val" id="tv">--<small>°C</small></div></div>
    <div class="card h"><div class="lbl">최신 습도</div><div class="val" id="hv">--<small>%</small></div></div>
  </div>
  <div class="time">측정: <b id="lt">--</b><span class="age" id="age"></span></div>
  <div class="toolbar">
    <button class="action-btn" id="exportBtn" type="button">CSV 저장</button>
    <button class="action-btn" id="copyBtn" type="button">최신값 복사</button>
  </div>

  <details class="settings" id="settings">
    <summary>보정값 설정</summary>
    <div class="settings-grid">
      <label>시간 보정 (시간)<input id="offsetInput" type="number" min="-24" max="24" step="0.5" inputmode="decimal"></label>
      <label>습도 보정 (%p)<input id="humOffsetInput" type="number" min="-100" max="100" step="0.5" inputmode="decimal"></label>
    </div>
    <p class="settings-help">ESP32 로그의 시각이 실제 시각과 다를 때 시간 보정을 사용하세요. 습도 보정은 원본 습도에 더해지며, 변경값은 이 브라우저에만 저장됩니다.</p>
    <div class="settings-actions"><button class="primary" id="applySettings" type="button">적용</button><button id="resetSettings" type="button">기본값 복원</button></div>
  </details>

  <section class="sec">
    <div class="sec-head"><h2>온도 추이</h2><span class="age" id="tempCount"></span></div>
    <div class="range-bar" role="group" aria-label="온도 추이 기간">
      <button data-range="1h" class="rbtn" type="button">1시간</button><button data-range="1d" class="rbtn active" type="button">1일</button><button data-range="3d" class="rbtn" type="button">3일</button><button data-range="1w" class="rbtn" type="button">1주</button><button data-range="1m" class="rbtn" type="button">1개월</button><button data-range="3m" class="rbtn" type="button">3개월</button><button data-range="6m" class="rbtn" type="button">6개월</button>
    </div>
    <div class="chart-box"><canvas id="tc" height="180" aria-label="온도 차트"></canvas><div class="chart-empty" id="tempEmpty">데이터 로딩 중...</div></div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>습도 추이</h2><span class="age" id="humCount"></span></div>
    <div class="range-bar" role="group" aria-label="습도 추이 기간">
      <button data-range="1h" class="rbtn" type="button">1시간</button><button data-range="1d" class="rbtn active" type="button">1일</button><button data-range="3d" class="rbtn" type="button">3일</button><button data-range="1w" class="rbtn" type="button">1주</button><button data-range="1m" class="rbtn" type="button">1개월</button><button data-range="3m" class="rbtn" type="button">3개월</button><button data-range="6m" class="rbtn" type="button">6개월</button>
    </div>
    <div class="chart-box"><canvas id="hc" height="180" aria-label="습도 차트"></canvas><div class="chart-empty" id="humEmpty">데이터 로딩 중...</div></div>
  </section>

  <section class="sec"><div class="sec-head"><h2>측정 기록</h2><span class="age">선택 구간 기준 · 최대 50개</span></div>
    <div class="table-wrap"><div class="scroll"><table><thead><tr><th>측정시각</th><th>온도(°C)</th><th>습도(%)</th></tr></thead><tbody id="tb"><tr><td colspan="3" class="empty">데이터 로딩 중...</td></tr></tbody></table></div></div>
  </section>
  <footer class="ft" id="fu">수동 새로고침 대기 중</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
(function(){
  'use strict';
  var SID='1X1kf9WwHaV1I1apmBNWig-TtqNjBnEMY_t08iKna404';
  var DEFAULT_OFFSET=16, DEFAULT_HUM_OFFSET=15, STALE_MS=5*60*1000;
  var CACHE_KEY='temp-monitor-cache-v2';
  var SETTINGS_KEY='temp-monitor-settings-v2';
  var currentRange='1d', allRows=[], tChart=null, hChart=null, chartSignature='', requestId=0, isFetching=false, lastDataSource='live';
  var settings={offset:DEFAULT_OFFSET, humOffset:DEFAULT_HUM_OFFSET};

  function $(id){return document.getElementById(id)}
  function finite(value){return typeof value==='number' && isFinite(value)}
  function numberValue(value){
    if(typeof value==='number') return finite(value)?value:NaN;
    if(value===null || value===undefined) return NaN;
    var text=String(value).trim().replace(/,/g,'');
    if(!text) return NaN;
    var parsed=parseFloat(text.replace(/[^0-9+\-.eE]/g,''));
    return finite(parsed)?parsed:NaN;
  }
  function formatOffset(value){return (value>=0?'+':'')+value+'h'}
  function readSettings(){
    try{
      var saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null');
      if(saved){
        if(finite(Number(saved.offset)) && Number(saved.offset)>=-24 && Number(saved.offset)<=24) settings.offset=Number(saved.offset);
        if(finite(Number(saved.humOffset)) && Number(saved.humOffset)>=-100 && Number(saved.humOffset)<=100) settings.humOffset=Number(saved.humOffset);
      }
    }catch(e){}
    $('offsetInput').value=settings.offset;
    $('humOffsetInput').value=settings.humOffset;
  }
  function saveSettings(){
    try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}catch(e){}
  }
  function setStatus(kind,text){
    $('st').textContent=text;
    $('st').style.color=kind==='live'?'var(--green)':(kind==='stale'||kind==='cached')?'var(--yellow)':'var(--red)';
    $('dot').className='dot '+(kind==='live'?'live':kind);
  }
  function formatDate(date,full){
    if(!(date instanceof Date)||isNaN(date.getTime())) return '--';
    return date.toLocaleString('ko-KR',full?{year:'numeric',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'}:{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'});
  }
  function csvDate(date){
    function pad(value){return String(value).padStart(2,'0')}
    return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())+' '+pad(date.getHours())+':'+pad(date.getMinutes())+':'+pad(date.getSeconds());
  }
  function formatAge(ms){
    if(!finite(ms)||ms<0) return '';
    var minutes=Math.floor(ms/60000);
    if(minutes<1) return '방금 전';
    if(minutes<60) return minutes+'분 전';
    var hours=Math.floor(minutes/60);
    if(hours<24) return hours+'시간 '+(minutes%60?minutes%60+'분 ':'')+'전';
    return Math.floor(hours/24)+'일 전';
  }
  function addHours(date,hours){return new Date(date.getTime()+hours*60*60*1000)}

  function parseVDate(value){
    if(value instanceof Date) return isNaN(value.getTime())?null:value;
    if(value===null||value===undefined) return null;
    var text=String(value).trim();
    var match=text.match(/^Date\(\s*(-?\d+)\s*,\s*(\d+)\s*,\s*(\d+)(?:\s*,\s*(\d+))?(?:\s*,\s*(\d+))?(?:\s*,\s*(\d+))?(?:\s*,\s*(\d+))?\s*\)$/i);
    if(match){
      var date=new Date(Number(match[1]),Number(match[2]),Number(match[3]),Number(match[4]||0),Number(match[5]||0),Number(match[6]||0),Number(match[7]||0));
      return isNaN(date.getTime())?null:date;
    }
    var korean=text.match(/^(\d{4})[.\-/]\s*(\d{1,2})[.\-/]\s*(\d{1,2})\s+(오전|오후)\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if(korean){
      var hour=Number(korean[5]);
      if(korean[4]==='오후'&&hour!==12) hour+=12;
      if(korean[4]==='오전'&&hour===12) hour=0;
      var koreanDate=new Date(Number(korean[1]),Number(korean[2])-1,Number(korean[3]),hour,Number(korean[6]),Number(korean[7]||0));
      return isNaN(koreanDate.getTime())?null:koreanDate;
    }
    var parsed=Date.parse(text);
    if(finite(parsed)){
      var fallback=new Date(parsed);
      return isNaN(fallback.getTime())?null:fallback;
    }
    if(/^\d+(\.\d+)?$/.test(text)){
      var serial=Number(text);
      if(serial>20000&&serial<70000){
        var excelDate=new Date(Date.UTC(1899,11,30)+serial*86400000);
        return isNaN(excelDate.getTime())?null:excelDate;
      }
    }
    return null;
  }

  function cellValue(cell){return cell&&cell.v!==undefined&&cell.v!==null?cell.v:null}
  function cellDisplayValue(cell){var value=cellValue(cell);return value!==null?value:cell&&cell.f}
  function findColumn(labels,patterns,fallback){
    for(var i=0;i<labels.length;i++){
      if(patterns.some(function(pattern){return pattern.test(labels[i])})) return i;
    }
    return fallback;
  }
  function parseResponse(data){
    var result=[];
    if(!data||!data.table||!Array.isArray(data.table.rows)) return result;
    var cols=data.table.cols||[];
    var labels=cols.map(function(col){return String((col&&((col.label||'')+' '+(col.id||'')))||'').toLowerCase()});
    var dateIndex=findColumn(labels,[/시간/,/일시/,/날짜/,/date/,/time/,/stamp/],0);
    var tempIndex=findColumn(labels,[/온도/,/temp/],1);
    var humIndex=findColumn(labels,[/습도/,/humid/,/humidity/],2);
    data.table.rows.forEach(function(row){
      if(!row||!Array.isArray(row.c)) return;
      var dateCell=row.c[dateIndex], tempCell=row.c[tempIndex], humCell=row.c[humIndex];
      var original=parseVDate(cellDisplayValue(dateCell));
      var temperature=numberValue(cellDisplayValue(tempCell));
      var rawHumidity=numberValue(cellDisplayValue(humCell));
      if(!original||!finite(temperature)||!finite(rawHumidity)) return;
      // DHT/ESP32 부팅 직후의 0/0 placeholder와 물리적으로 불가능한 값을 제외한다.
      if(temperature===0&&rawHumidity===0) return;
      if(temperature<-80||temperature>120||rawHumidity<0||rawHumidity>100) return;
      result.push({orig:original,t:temperature,rawH:rawHumidity});
    });
    return result;
  }
  function applySettings(rows){
    return rows.map(function(row){var corrected=Math.min(100,Math.max(0,row.rawH+settings.humOffset));return {orig:new Date(row.orig),adj:addHours(new Date(row.orig),settings.offset),t:row.t,rawH:row.rawH,h:corrected}}).filter(function(row){return finite(row.h)});
  }
  function serializeRows(rows){return rows.slice(-20000).map(function(row){return {orig:row.orig.toISOString(),t:row.t,rawH:row.rawH}})}
  function saveCache(rows){try{localStorage.setItem(CACHE_KEY,JSON.stringify({savedAt:Date.now(),rows:serializeRows(rows)}))}catch(e){}}
  function loadCache(){
    try{
      var saved=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
      if(!saved||!Array.isArray(saved.rows)) return null;
      var source=saved.rows.map(function(row){return {orig:new Date(row.orig),t:Number(row.t),rawH:Number(row.rawH)}}).filter(function(row){return !isNaN(row.orig.getTime())&&finite(row.t)&&finite(row.rawH)});
      return source.length?{rows:applySettings(source),savedAt:Number(saved.savedAt)||0}:null;
    }catch(e){return null}
  }

  // GViz는 google.visualization.Query.setResponse 전역 콜백을 사용하므로, 요청마다 안전하게 정리한다.
  function fetchGviz(callback){
    var id=++requestId, oldScript=$('_gviz_s'), settled=false;
    if(oldScript) oldScript.remove();
    var timer, query, previousSetResponse;
    function finish(error,data){
      if(settled||id!==requestId) return;
      settled=true; clearTimeout(timer);
      if(query){if(previousSetResponse===undefined) delete query.setResponse; else query.setResponse=previousSetResponse;}
      var script=$('_gviz_s'); if(script) script.remove();
      callback(error,data);
    }
    var root=window.google||(window.google={});
    var visualization=root.visualization||(root.visualization={});
    query=visualization.Query||(visualization.Query={});
    previousSetResponse=query.setResponse;
    query.setResponse=function(data){finish(null,data)};
    timer=setTimeout(function(){finish(new Error('요청 시간 초과'))},15000);
    var script=document.createElement('script');
    script.id='_gviz_s';
    script.src='https://docs.google.com/spreadsheets/d/'+encodeURIComponent(SID)+'/gviz/tq?tqx=out:json&t='+Date.now();
    script.onerror=function(){finish(new Error('Google Sheets 연결 실패'))};
    document.head.appendChild(script);
  }

  function aggregate(data,unit){
    var groups={};
    data.forEach(function(row){
      var date=new Date(row.adj);
      if(unit==='hour') date.setMinutes(0,0,0);
      if(unit==='fourHour'){date.setMinutes(0,0,0);date.setHours(Math.floor(date.getHours()/4)*4)}
      if(unit==='day') date.setHours(0,0,0,0);
      var key=date.getTime();
      if(!groups[key]) groups[key]={adj:new Date(key),t:0,h:0,count:0};
      groups[key].t+=row.t; groups[key].h+=row.h; groups[key].count++;
    });
    return Object.keys(groups).map(function(key){var group=groups[key];return {adj:group.adj,t:+(group.t/group.count).toFixed(1),h:+(group.h/group.count).toFixed(1)}}).sort(function(a,b){return a.adj-b.adj});
  }
  function rangeMilliseconds(){return { '1h':3600000,'1d':86400000,'3d':259200000,'1w':604800000,'1m':2592000000,'3m':7776000000,'6m':15552000000}[currentRange]||86400000}
  function getDisplayData(){
    var valid=allRows.filter(function(row){return finite(row.t)&&finite(row.h)});
    if(!valid.length) return [];
    var latest=valid.slice().sort(function(a,b){return b.adj-a.adj})[0];
    var start=new Date(latest.adj.getTime()-rangeMilliseconds());
    var range=valid.filter(function(row){return row.adj>=start&&row.adj<=latest.adj});
    if(currentRange==='3d'||currentRange==='1w') return aggregate(range,'hour');
    if(currentRange==='1m') return aggregate(range,'fourHour');
    if(currentRange==='3m'||currentRange==='6m') return aggregate(range,'day');
    return range.slice().sort(function(a,b){return a.adj-b.adj});
  }
  function scaleOptions(){
    var options={type:'time',time:{},grid:{color:'rgba(255,255,255,.06)'},ticks:{color:'#64748b',font:{size:10}}};
    var map={
      '1h':{unit:'minute',stepSize:10,format:'HH:mm',limit:8},'1d':{unit:'hour',stepSize:3,format:'HH:mm',limit:12},
      '3d':{unit:'hour',stepSize:6,format:'MM/dd HH:mm',limit:12},'1w':{unit:'day',stepSize:1,format:'MM/dd',limit:8},'1m':{unit:'day',stepSize:4,format:'MM/dd',limit:8},
      '3m':{unit:'week',stepSize:2,format:'MM/dd',limit:8},'6m':{unit:'month',stepSize:1,format:'yy/MM',limit:8}
    }[currentRange]||null;
    if(map){options.time.unit=map.unit;options.time.stepSize=map.stepSize;options.time.displayFormats={};options.time.displayFormats[map.unit]=map.format;options.ticks.maxTicksLimit=map.limit}
    return options;
  }
  function isCoarsePointer(){return window.matchMedia&&window.matchMedia('(pointer: coarse)').matches}
  function chartOptions(){
    var coarse=isCoarsePointer();
    return {
      responsive:true,maintainAspectRatio:false,resizeDelay:100,
      // 모바일에서는 touchmove를 Chart.js에 전달하지 않아 손가락 미세 이동에 따른 타점 교체/떨림을 막는다.
      events:coarse?['touchstart','click']:['mousemove','mouseout','click'],
      animation:false,hover:{animationDuration:0},
      interaction:coarse?{mode:'nearest',axis:'x',intersect:false}:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{animation:false,mode:'nearest',intersect:false,callbacks:{title:function(items){return items.length?formatDate(new Date(items[0].parsed.x),true):''}}}},
      transitions:{active:{animation:{duration:0}}},
      scales:{x:scaleOptions(),y:{grid:{color:'rgba(255,255,255,.06)'},ticks:{color:'#64748b',font:{size:10}}}},
      elements:{point:{radius:2,hoverRadius:4,hitRadius:12},line:{tension:.35,borderWidth:2}}
    };
  }
  function clearCharts(){
    if(tChart){tChart.destroy();tChart=null}
    if(hChart){hChart.destroy();hChart=null}
    chartSignature='';
  }
  function drawCharts(rows){
    var hasChart=typeof window.Chart==='function';
    $('tempEmpty').style.display=rows.length&&hasChart?'none':'flex'; $('humEmpty').style.display=rows.length&&hasChart?'none':'flex';
    if(!rows.length){$('tempEmpty').textContent='선택 구간에 데이터가 없습니다';$('humEmpty').textContent='선택 구간에 데이터가 없습니다'}
    else if(!hasChart){$('tempEmpty').textContent='차트 라이브러리를 불러오지 못했습니다';$('humEmpty').textContent='차트 라이브러리를 불러오지 못했습니다'}
    if(!hasChart||!rows.length){clearCharts();return}
    var tempData=rows.map(function(row){return {x:row.adj.getTime(),y:row.t}}), humData=rows.map(function(row){return {x:row.adj.getTime(),y:row.h}});
    var signature=currentRange+'|'+rows.map(function(row){return row.adj.getTime()+':'+row.t+':'+row.h}).join(';');
    if(signature===chartSignature&&tChart&&hChart)return;
    try{
      if(tChart&&hChart){
        // 새 로그가 들어와도 canvas를 갈아끼우지 않고 데이터만 갱신해 터치 중 레이아웃 점프를 방지한다.
        tChart.data.datasets[0].data=tempData; tChart.options=chartOptions(); tChart.update('none');
        hChart.data.datasets[0].data=humData; hChart.options=chartOptions(); hChart.update('none');
      }else{
        clearCharts();
        tChart=new Chart($('tc'),{type:'line',data:{datasets:[{data:tempData,borderColor:'#f97316',backgroundColor:'rgba(249,115,22,.08)',fill:true}]},options:chartOptions()});
        hChart=new Chart($('hc'),{type:'line',data:{datasets:[{data:humData,borderColor:'#06b6d4',backgroundColor:'rgba(6,182,212,.08)',fill:true}]},options:chartOptions()});
      }
      chartSignature=signature;
    }catch(error){
      console.error('Chart render error:',error); clearCharts();
      $('tempEmpty').textContent='차트를 표시할 수 없습니다'; $('humEmpty').textContent='차트를 표시할 수 없습니다'; $('tempEmpty').style.display='flex'; $('humEmpty').style.display='flex';
    }
  }
  function updateTable(rows){
    var show=rows.slice().sort(function(a,b){return b.adj-a.adj}).slice(0,50), body=$('tb');
    if(!show.length){body.innerHTML='<tr><td colspan="3" class="empty">선택 구간에 데이터가 없습니다</td></tr>';return}
    body.innerHTML=show.map(function(row){return '<tr><td>'+formatDate(row.adj,false)+'</td><td class="tc">'+row.t.toFixed(1)+'°</td><td class="hc">'+row.h.toFixed(1)+'%</td></tr>'}).join('');
  }
  function updateUI(source){
    if(source) lastDataSource=source;
    var valid=allRows.filter(function(row){return finite(row.t)&&finite(row.h)});
    if(!valid.length){
      $('tv').innerHTML='--<small>°C</small>'; $('hv').innerHTML='--<small>%</small>'; $('lt').textContent='측정 기록 없음'; $('age').textContent='';
      $('tempCount').textContent=''; $('humCount').textContent=''; updateTable([]); drawCharts([]); if(source!=='error')setStatus('error','데이터 없음'); return;
    }
    var latest=valid.slice().sort(function(a,b){return b.adj-a.adj})[0], ageMs=Math.max(0,Date.now()-latest.adj.getTime());
    $('tv').innerHTML=latest.t.toFixed(1)+'<small>°C</small>'; $('hv').innerHTML=latest.h.toFixed(1)+'<small>%</small>'; $('lt').textContent=formatDate(latest.adj,true); $('age').textContent='('+formatAge(ageMs)+')';
    if(lastDataSource==='cache')setStatus('cached','캐시 데이터 표시 · 연결 재시도 중...'); else if(ageMs>STALE_MS)setStatus('stale','연결됨 · 장비 기록이 오래됨'); else setStatus('live','실시간 연결됨');
    var display=getDisplayData(); $('tempCount').textContent=display.length+'개'; $('humCount').textContent=display.length+'개'; updateTable(display); drawCharts(display);
    $('fu').textContent='마지막 갱신: '+new Date().toLocaleTimeString('ko-KR')+' · 데이터 '+valid.length+'개 · 보정 '+formatOffset(settings.offset)+' / 습도 '+(settings.humOffset>=0?'+':'')+settings.humOffset+'%p';
  }
  function fetchData(){
    if(isFetching)return;
    isFetching=true; $('refreshBtn').disabled=true; $('refreshBtn').textContent='↻ 가져오는 중';
    fetchGviz(function(error,data){
      isFetching=false; $('refreshBtn').disabled=false; $('refreshBtn').textContent='↻ 새로고침';
      if(error){
        if(allRows.length){lastDataSource='cache';setStatus('cached','연결 실패 · 이전 데이터 표시 중');}
        else {
          setStatus('error','연결 실패 · 재시도 중...');
          $('tempEmpty').textContent='데이터를 불러오지 못했습니다'; $('humEmpty').textContent='데이터를 불러오지 못했습니다';
          $('tempEmpty').style.display='flex'; $('humEmpty').style.display='flex'; $('tb').innerHTML='<tr><td colspan="3" class="empty">연결 실패 · 새로고침으로 다시 시도하세요</td></tr>';
        }
        $('fu').textContent='Google Sheets에 연결할 수 없습니다. 새로고침을 눌러 재시도하세요.'; return;
      }
      var source=parseResponse(data);
      if(source.length){allRows=applySettings(source);saveCache(source);updateUI('live')}
      else if(allRows.length){
        lastDataSource='cache';
        setStatus('cached','유효한 측정 없음 · 이전 데이터 유지');
        $('fu').textContent='새 응답에서 유효한 측정값을 찾지 못했습니다. 이전 데이터를 표시 중입니다.';
      }
      else {allRows=[];updateUI('empty')}
    });
  }
  function exportCsv(){
    var rows=getDisplayData();
    if(!rows.length){setStatus('error','내보낼 데이터가 없습니다');return}
    var lines=['측정시각,온도(°C),습도(%)'];
    rows.slice().sort(function(a,b){return a.adj-b.adj}).forEach(function(row){lines.push([csvDate(row.adj),row.t.toFixed(1),row.h.toFixed(1)].join(','))});
    var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}), url=URL.createObjectURL(blob), link=document.createElement('a');
    link.href=url; link.download='temperature-'+currentRange+'-'+csvDate(new Date()).slice(0,10)+'.csv'; document.body.appendChild(link); link.click(); link.remove(); setTimeout(function(){URL.revokeObjectURL(url)},1000);
  }
  function copyLatest(){
    var valid=allRows.filter(function(row){return finite(row.t)&&finite(row.h)}).sort(function(a,b){return b.adj-a.adj});
    if(!valid.length){setStatus('error','복사할 데이터가 없습니다');return}
    var row=valid[0], text='측정시각: '+formatDate(row.adj,true)+'\n온도: '+row.t.toFixed(1)+'°C\n습도: '+row.h.toFixed(1)+'%';
    function done(){var old=$('copyBtn').textContent;$('copyBtn').textContent='복사 완료';setTimeout(function(){$('copyBtn').textContent=old},1500)}
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(function(){fallbackCopy(text,done)}); else fallbackCopy(text,done);
  }
  function fallbackCopy(text,done){var area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();try{document.execCommand('copy');done()}catch(e){setStatus('error','복사하지 못했습니다')}area.remove()}
  function setRange(range){
    if(currentRange===range)return; currentRange=range;
    document.querySelectorAll('.rbtn').forEach(function(btn){btn.classList.toggle('active',btn.dataset.range===range)});
    if(allRows.length)updateUI();
  }
  function applySettingsFromForm(){
    var offset=Number($('offsetInput').value), humOffset=Number($('humOffsetInput').value);
    if(!finite(offset)||offset<-24||offset>24||!finite(humOffset)||humOffset<-100||humOffset>100){setStatus('error','보정값 범위를 확인하세요');return}
    settings={offset:offset,humOffset:humOffset};saveSettings();
    var source=allRows.map(function(row){return {orig:row.orig,t:row.t,rawH:row.rawH}});allRows=applySettings(source);updateUI();$('settings').open=false;
  }
  function start(){
    readSettings();
    document.querySelectorAll('.rbtn').forEach(function(btn){btn.addEventListener('click',function(){setRange(btn.dataset.range)})});
    $('refreshBtn').addEventListener('click',fetchData); $('exportBtn').addEventListener('click',exportCsv); $('copyBtn').addEventListener('click',copyLatest); $('applySettings').addEventListener('click',applySettingsFromForm);
    $('resetSettings').addEventListener('click',function(){
      settings={offset:DEFAULT_OFFSET,humOffset:DEFAULT_HUM_OFFSET};
      $('offsetInput').value=DEFAULT_OFFSET; $('humOffsetInput').value=DEFAULT_HUM_OFFSET; saveSettings();
      var source=allRows.map(function(row){return {orig:row.orig,t:row.t,rawH:row.rawH}}); allRows=applySettings(source); updateUI();
    });
    var cached=loadCache(); if(cached){allRows=cached.rows;updateUI('cache')}
    fetchData();
    window.addEventListener('online',fetchData); window.addEventListener('offline',function(){if(allRows.length){lastDataSource='cache';setStatus('cached','오프라인 · 이전 데이터 표시 중')}else setStatus('error','인터넷 연결 없음')});
  }
  start();
})();
</script>
